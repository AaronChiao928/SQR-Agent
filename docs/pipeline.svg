<svg xmlns="http://www.w3.org/2000/svg" width="680" height="870" viewBox="0 0 680 870" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SQR agent pipeline</title>
  <desc>Flow from the Google Ads search terms report and brand profile through input checks, scope check, rule layer, AI classification, code verification, human review and export. Grey steps are done by code, purple by the AI, teal by a person.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .code rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .code .t { fill: #2C2C2A; } .code .s { fill: #5F5E5A; }
      .ai rect { fill: #EEEDFE; stroke: #534AB7; }
      .ai .t { fill: #3C3489; } .ai .s { fill: #534AB7; }
      .person rect { fill: #E1F5EE; stroke: #0F6E56; }
      .person .t { fill: #085041; } .person .s { fill: #0F6E56; }
      .t { font-size: 14px; font-weight: 600; }
      .s { font-size: 12px; }
      .arr { stroke: #73726C; stroke-width: 1.2; fill: none; }
      .note { font-size: 12px; fill: #5F5E5A; }
    </style>
  </defs>
  <rect x="0" y="0" width="680" height="870" rx="12" fill="#FFFFFF"/>

  <g class="code"><rect x="60" y="40" width="220" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="170" y="63" text-anchor="middle">Search terms report</text>
    <text class="s" x="170" y="82" text-anchor="middle">Google Ads export</text></g>
  <g class="code"><rect x="300" y="40" width="220" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="410" y="63" text-anchor="middle">Brand profile</text>
    <text class="s" x="410" y="82" text-anchor="middle">Lists, rules, naming</text></g>
  <path class="arr" d="M170 96 L170 116 L250 116 L250 134" marker-end="url(#arrow)"/>
  <path class="arr" d="M410 96 L410 116 L330 116 L330 134" marker-end="url(#arrow)"/>

  <g class="code"><rect x="150" y="136" width="280" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="290" y="159" text-anchor="middle">Input checks</text>
    <text class="s" x="290" y="178" text-anchor="middle">Blanks, duplicates, set aside</text></g>
  <line class="arr" x1="290" y1="192" x2="290" y2="230" marker-end="url(#arrow)"/>

  <g class="code"><rect x="150" y="232" width="280" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="290" y="255" text-anchor="middle">Scope check</text>
    <text class="s" x="290" y="274" text-anchor="middle">Generic campaigns only</text></g>
  <line class="arr" x1="430" y1="260" x2="468" y2="260" marker-end="url(#arrow)"/>
  <g class="code"><rect x="470" y="232" width="170" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="555" y="255" text-anchor="middle">Not processed</text>
    <text class="s" x="555" y="274" text-anchor="middle">Listed, no action</text></g>
  <line class="arr" x1="290" y1="288" x2="290" y2="326" marker-end="url(#arrow)"/>

  <g class="code"><rect x="150" y="328" width="280" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="290" y="351" text-anchor="middle">Rule layer</text>
    <text class="s" x="290" y="370" text-anchor="middle">Brand, competitor, retailer lists</text></g>
  <line class="arr" x1="430" y1="356" x2="468" y2="356" marker-end="url(#arrow)"/>
  <g class="code"><rect x="470" y="328" width="170" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="555" y="351" text-anchor="middle">Rule negatives</text>
    <text class="s" x="555" y="370" text-anchor="middle">Shared list, Broad</text></g>
  <line class="arr" x1="290" y1="384" x2="290" y2="422" marker-end="url(#arrow)"/>

  <g class="ai"><rect x="150" y="424" width="280" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="290" y="447" text-anchor="middle">AI classification</text>
    <text class="s" x="290" y="466" text-anchor="middle">Terms with no list hit: A / B / C / D</text></g>
  <line class="arr" x1="290" y1="480" x2="290" y2="518" marker-end="url(#arrow)"/>

  <g class="code"><rect x="150" y="520" width="280" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="290" y="543" text-anchor="middle">Code verification</text>
    <text class="s" x="290" y="562" text-anchor="middle">Invalid: retry once, then user</text></g>
  <line class="arr" x1="290" y1="576" x2="290" y2="614" marker-end="url(#arrow)"/>

  <g class="person"><rect x="150" y="616" width="280" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="290" y="639" text-anchor="middle">Human review</text>
    <text class="s" x="290" y="658" text-anchor="middle">Approve or reject each item</text></g>
  <path class="arr" d="M555 384 L555 644 L434 644" marker-end="url(#arrow)"/>
  <line class="arr" x1="290" y1="672" x2="290" y2="710" marker-end="url(#arrow)"/>

  <g class="code"><rect x="150" y="712" width="280" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="290" y="735" text-anchor="middle">Export files</text>
    <text class="s" x="290" y="754" text-anchor="middle">Editor files + review log</text></g>
  <line class="arr" x1="430" y1="740" x2="468" y2="740" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <rect x="470" y="712" width="170" height="56" rx="8" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
  <text x="555" y="735" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Ads account</text>
  <text x="555" y="754" text-anchor="middle" font-size="12" fill="#5F5E5A">Manual upload only</text>

  <g class="code"><rect x="190" y="800" width="14" height="14" rx="3" stroke-width="0.8"/></g>
  <text class="note" x="211" y="811">Code</text>
  <g class="ai"><rect x="270" y="800" width="14" height="14" rx="3" stroke-width="0.8"/></g>
  <text class="note" x="291" y="811">AI</text>
  <g class="person"><rect x="330" y="800" width="14" height="14" rx="3" stroke-width="0.8"/></g>
  <text class="note" x="351" y="811">Person</text>
  <text class="note" x="340" y="842" text-anchor="middle">Approved list additions are written back to the brand profile.</text>
</svg>
